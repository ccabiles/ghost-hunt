<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Ghost Hunt</title>
<style>
:root{--bg:#0b0a14;--ink:#ece9fa;--mut:#9b95bb;--acc:#ffd25a;--pnl:#1b1832;color-scheme:dark}
html,body{height:100%;margin:0;background:var(--bg);color:var(--ink);font-family:Georgia,"Times New Roman",serif;overflow:hidden}
canvas{position:fixed;inset:0;width:100%;height:100%}
#menu{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;gap:14px;background:rgba(11,10,20,.92);text-align:center;padding:24px;overflow:auto}
#menu::before,#menu::after{content:"";margin:auto} /* centres the content but lets tall screens scroll */
#mc{display:flex;flex-direction:column;align-items:center;gap:14px;max-width:100%}
#menu>.logo{height:clamp(58px,11vh,104px);flex:none;pointer-events:none}
#mute{position:fixed;top:calc(19px + env(safe-area-inset-top,0px));left:84px;display:none;padding:4px 9px;font-size:16px;line-height:1.3}
#hudlogo{position:fixed;top:calc(5px + env(safe-area-inset-top,0px));left:50%;transform:translateX(-50%);height:58px;pointer-events:none;display:none}
h1{font-size:clamp(28px,4.2vw,46px);margin:0;letter-spacing:-.01em;font-style:italic;text-shadow:0 0 22px rgba(124,242,160,.35)}
p{max-width:540px;margin:0;color:var(--mut);line-height:1.5}
ol{margin:0;padding:0;list-style-position:inside;columns:2;column-gap:40px;text-align:left}
button,input{font:inherit;font-size:17px;padding:10px 18px;border-radius:8px;border:2px solid var(--acc);background:var(--pnl);color:var(--ink)}
button{cursor:pointer}button:hover:not(:disabled),button:focus-visible{background:var(--acc);color:#1a1530;outline:none}
button:disabled{opacity:.4;cursor:default}
.slw{width:min(340px,86vw);margin:6px auto;text-align:center}.slw b{display:block;font-size:18px;margin-bottom:6px}.slw input{width:100%;accent-color:#b48cff;height:28px;cursor:pointer}.slt{display:flex;justify-content:space-between;font-size:12px;opacity:.7}
.row{display:flex;gap:12px;flex-wrap:wrap;justify-content:center}
button.sel{background:var(--acc);color:#1a1530}
#leave{position:fixed;top:calc(19px + env(safe-area-inset-top,0px));left:12px;display:none;padding:5px 12px;font-size:14px}
.chip{display:inline-block;padding:0 8px;border:1px solid var(--mut);border-radius:10px;font-size:13px;color:var(--mut);margin-left:6px}
@keyframes fade{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.aw{opacity:0;animation:fade .6s both}
.awards{display:flex;flex-direction:column;gap:12px;min-width:min(440px,90vw)}
.awards .aw{display:flex;gap:16px;align-items:center;text-align:left;background:var(--pnl);border:2px solid var(--acc);border-radius:12px;padding:12px 18px;font-size:18px}
.ico{font-size:36px}
#splash{position:fixed;inset:0;z-index:20;background:#0b0a14;display:flex;align-items:center;justify-content:center;cursor:pointer;outline:none}
#splash img{max-width:100%;max-height:100%;object-fit:contain;opacity:0;transition:opacity .5s}
#splash img.ok{opacity:1}
summary{color:var(--acc);cursor:pointer;font-size:16px}
details{max-width:640px;width:100%}
.guide{display:grid;grid-template-columns:1fr 1fr;gap:10px;max-width:640px;width:100%;text-align:left;margin-top:8px}
.gc{background:var(--pnl);border:1px solid #3a3560;border-radius:10px;padding:10px 14px;display:flex;flex-direction:column;gap:10px}
.gc.wide{grid-column:1/-1}
.gc h3{margin:0;font-size:16px;color:var(--acc);font-weight:normal;letter-spacing:.02em}
.ct{display:flex;align-items:center;gap:8px;flex-wrap:wrap;min-height:48px}
.ct small,.foot small{color:var(--mut);font-size:13px;margin-left:auto;text-align:right}
.ct em{color:var(--mut);font-size:12px;font-style:italic}
.dp{display:inline-flex;flex-direction:column;align-items:center;gap:3px}.dp>span{display:flex;gap:3px}
.k{display:inline-flex;align-items:center;justify-content:center;min-width:26px;height:26px;padding:0 4px;box-sizing:border-box;font:bold 13px/1 ui-monospace,Menlo,Consolas,monospace;font-style:normal;color:var(--ink);background:linear-gradient(#2c2850,#1b1832);border:1px solid #6a63a0;border-bottom-width:3px;border-radius:6px}
.k.wide{min-width:84px;padding:0 10px}
.ic{color:#bdb7e0;flex:none}
.hold{font-size:12px;color:var(--mut);font-style:italic}
.leg{display:flex;justify-content:space-between;align-items:center;gap:8px;border-top:1px solid rgba(255,255,255,.08);padding-top:8px;font-size:15px}
.leg span{display:inline-flex;align-items:center;gap:5px}.leg b{color:var(--mut);font-weight:normal}
.bt{display:inline-block;width:11px;height:17px;border-radius:2px;background:#7cf2a0;box-shadow:0 0 8px rgba(124,242,160,.6)}
.sbt{width:15px;height:23px;background:#4aa8ff;box-shadow:0 0 12px rgba(74,168,255,.9);animation:sbp 1s infinite alternate}
@keyframes sbp{to{box-shadow:0 0 20px rgba(120,200,255,1)}}
.foot{flex-direction:row;justify-content:space-around;align-items:center;flex-wrap:wrap}
.foot span{display:inline-flex;align-items:center;gap:6px}.foot small{margin:0}
@media(max-width:560px){.guide{grid-template-columns:1fr}}
.modes{max-width:640px;width:100%}
.mh{display:block;color:var(--acc);font-weight:normal;margin-bottom:6px}
.mrow{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.mc{display:flex;gap:10px;align-items:center;text-align:left;padding:10px 14px;border-radius:10px;font-size:15px;border:2px solid #3a3560;background:var(--pnl);color:var(--ink);line-height:1.3}
button.mc{cursor:pointer}.mc small{color:var(--mut);font-size:12.5px}.mc .mi{font-size:26px}
.mc.sel{border-color:var(--acc);background:#2a2548;color:var(--ink)}button.mc.sel:hover,button.mc.sel:focus-visible{background:#2a2548;color:var(--ink)}
button.mc:hover:not(.sel){background:#26224a;color:var(--ink)}
.mn{color:var(--mut)}
.stand{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;max-width:560px}.stand span{padding:3px 10px;border:1px solid #3a3560;border-radius:12px;background:var(--pnl);font-size:14px}.stand b{color:var(--acc)}
@media(max-width:560px){.mrow{grid-template-columns:1fr}}
html{touch-action:manipulation}
#tc{position:fixed;inset:0;z-index:5;display:none;pointer-events:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;touch-action:none}
.tz{position:absolute;top:64px;bottom:0;pointer-events:auto;touch-action:none}
#tl{left:0;width:50%}#tr{right:0;width:50%}
.sb{position:fixed;display:none;width:108px;height:108px;border-radius:50%;border:3px solid rgba(255,210,90,.55);background:rgba(27,24,50,.35);pointer-events:none;box-sizing:border-box}
.sb>i{position:absolute;left:34px;top:34px;width:34px;height:34px;border-radius:50%;background:rgba(255,210,90,.75);box-shadow:0 0 12px rgba(255,210,90,.6)}
#tg{position:absolute;right:max(18px,env(safe-area-inset-right));bottom:max(20px,env(safe-area-inset-bottom));display:none;flex-direction:column;gap:14px;pointer-events:auto}
#tg button{width:96px;height:96px;border-radius:50%;font-size:16px;font-weight:bold;padding:0;background:rgba(27,24,50,.7);touch-action:none;display:flex;flex-direction:column;align-items:center;justify-content:center}
#tg button small{font-size:11px;font-weight:normal;opacity:.8}
#tg button.dn{background:var(--acc);color:#1a1530}
#rot{position:absolute;inset:0;background:rgba(11,10,20,.96);color:var(--acc);font-size:22px;align-items:center;justify-content:center;text-align:center;padding:30px;pointer-events:auto;display:none}
@media(pointer:coarse){#leave{padding:8px 12px;font-size:15px}#mute{left:92px;padding:6px 10px}button,input{font-size:18px}}
</style></head><body>

 const wood=(x,y,w,h,hu=24,sa=30,li=24,vert=false)=>{g.fillStyle=`hsl(${hu} ${sa}% ${li}%)`;g.fillRect(x,y,w,h);g.strokeStyle='rgba(0,0,0,.28)';g.lineWidth=.8;

 const flame=(x,y,s=1)=>{g.fillStyle='rgba(255,170,60,.9)';g.beginPath();g.ellipse(x,y,1.8*s,3*s,0,0,7);g.fill();g.fillStyle='#fff2b0';g.beginPath();g.ellipse(x,y+.6*s,.9*s,1.8*s,0,0,7);g.fill()};
