<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ghost Hunt</title>
<style>
:root{--bg:#0b0a14;--ink:#ece9fa;--mut:#9b95bb;--acc:#ffd25a;--pnl:#1b1832;color-scheme:dark}
html,body{height:100%;margin:0;background:var(--bg);color:var(--ink);font-family:Georgia,"Times New Roman",serif;overflow:hidden}
canvas{position:fixed;inset:0;width:100%;height:100%}
#menu{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;gap:14px;background:rgba(11,10,20,.92);text-align:center;padding:24px;overflow:auto}
#menu::before,#menu::after{content:"";margin:auto} /* centres the content but lets tall screens scroll */
#mc{display:flex;flex-direction:column;align-items:center;gap:14px;max-width:100%}
#menu>.logo{height:clamp(58px,11vh,104px);flex:none;pointer-events:none}
#mute{position:fixed;top:calc(19px + env(safe-area-inset-top,0px));left:84px;display:none;padding:4px 9px;font-size:16px;line-height:1.3}
#hudlogo{position:fixed;top:calc(5px + env(safe-area-inset-top,0px));left:50%;transform:translateX(-50%);height:58px;pointer-events:none;display:none}
h1{font-size:clamp(28px,4.2vw,46px);margin:0;letter-spacing:-.01em;font-style:italic;text-shadow:0 0 22px rgba(124,242,160,.35)}
p{max-width:540px;margin:0;color:var(--mut);line-height:1.5}
ol{margin:0;padding:0;list-style-position:inside;columns:2;column-gap:40px;text-align:left}
button,input{font:inherit;font-size:17px;padding:10px 18px;border-radius:8px;border:2px solid var(--acc);background:var(--pnl);color:var(--ink)}
button{cursor:pointer}button:hover:not(:disabled),button:focus-visible{background:var(--acc);color:#1a1530;outline:none}
button:disabled{opacity:.4;cursor:default}
.row{display:flex;gap:12px;flex-wrap:wrap;justify-content:center}
button.sel{background:var(--acc);color:#1a1530}
#leave{position:fixed;top:calc(19px + env(safe-area-inset-top,0px));left:12px;display:none;padding:5px 12px;font-size:14px}
.chip{display:inline-block;padding:0 8px;border:1px solid var(--mut);border-radius:10px;font-size:13px;color:var(--mut);margin-left:6px}
@keyframes fade{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.aw{opacity:0;animation:fade .6s both}
.awards{display:flex;flex-direction:column;gap:12px;min-width:min(440px,90vw)}
.awards .aw{display:flex;gap:16px;align-items:center;text-align:left;background:var(--pnl);border:2px solid var(--acc);border-radius:12px;padding:12px 18px;font-size:18px}
.ico{font-size:36px}
#splash{position:fixed;inset:0;z-index:20;background:#0b0a14;display:flex;align-items:center;justify-content:center;cursor:pointer;outline:none}
#splash img{max-width:100%;max-height:100%;object-fit:contain;opacity:0;transition:opacity .5s}
#splash img.ok{opacity:1}
summary{color:var(--acc);cursor:pointer;font-size:16px}
details{max-width:540px}
</style></head><body>
<div id="splash" role="button" tabindex="0" aria-label="Play now"><img id="splimg" alt="Ghost Hunt: click to play"></div>
<canvas id="c"></canvas><button id="leave">Leave</button><button id="mute" title="Music on/off (M)" aria-label="Music on or off">🔊</button><img id="hudlogo" src="/logo.webp" alt="Ghost Hunt">
<div id="menu"><img class="logo" src="/logo.webp" alt="Ghost Hunt"><div id="mc"></div></div>
<script>
const T=32,RANGE=210,HALF=.42,$=id=>document.getElementById(id),cv=$('c'),ctx=cv.getContext('2d');
const esc=s=>String(s).replace(/[&<>"']/g,c=>'&#'+c.charCodeAt(0)+';');
const CONTROLS='<b>Hunters:</b> WASD or arrow keys to move, mouse to aim, hold click or Space for light. A fainted friend shows a grey heart: keep a flashlight on them to fill it red and revive them (10 seconds with one light, faster with more).<br><b>Ghost:</b> move with WASD or arrows, Shift to dash, hold E to charge magic and release to drain every battery. Windows flicker just before lightning shines through them. The light travels in straight lines until a wall or furniture blocks it, and a ghost caught in it is revealed to every hunter for a few seconds. A flashlight beam briefly stuns the ghost, and the ghost can drag a hunter it just made faint a short way. Batteries keep respawning around the map. The ghost starts in the middle of the map and is revealed briefly at the start. Press M to turn the music on or off. The layout changes every game.';
let edges=null,grid=null,W=0,H=0,PW=0,PH=0,base=null,sc=1,ox=0,oy=0;
const fog=document.createElement('canvas'),fc=fog.getContext('2d');
const names={},D={},DG={x:0,y:0,tx:0,ty:0,vis:0},keys={},mouse={x:0,y:0,down:false};
let me=0,S=null,ph='join',host=0,msg='',scores=[],ms=[0,0,3],fin='',lastM='',bo=5,mp=0,aw=null,awT=0,help=false;
let live=true;
const ws=(()=>{try{if(!/^https?:$/.test(location.protocol)||!location.host)throw 0;return new WebSocket((location.protocol=='https:'?'wss://':'ws://')+location.host)}catch(e){live=false;return{readyState:0,send(){}}}})();
const wall=(x,y)=>{const tx=x/T|0,ty=y/T|0;return x<0||y<0||tx>=W||ty>=H||grid[ty][tx]};
// side: 0 top, 1 right, 2 bottom, 3 left. The server sends the window rectangles and the light strips they cast (stopped by walls and furniture)
let WN=[[],[],[],[]],STRP=[[],[],[],[]];
function lg(c,s,x,y,w,h,a,b){const g=s==0?c.createLinearGradient(x,y,x,y+h):s==2?c.createLinearGradient(x,y+h,x,y):s==3?c.createLinearGradient(x,y,x+w,y):c.createLinearGradient(x+w,y,x,y);g.addColorStop(0,a);g.addColorStop(1,b);return g}
const angd=(a,b)=>{let d=a-b;while(d>Math.PI)d-=2*Math.PI;while(d<-Math.PI)d+=2*Math.PI;return d};
function cone(h){const p=[[h.x,h.y]];for(let i=0;i<=36;i++){const a=h.ang-HALF+2*HALF*i/36,cx=Math.cos(a),cy=Math.sin(a);let d=0;while(d<RANGE&&!wall(h.x+cx*d,h.y+cy*d))d+=6;p.push([h.x+cx*d,h.y+cy*d])}return p}
function rng(a){return()=>{a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function buildMap(rows,seed){
 grid=rows.map(r=>[...r].map(Number));H=grid.length;W=grid[0].length;PW=W*T;PH=H*T;
 base=document.createElement('canvas');base.width=fog.width=PW;base.height=fog.height=PH;const bc=base.getContext('2d'),R=rng(seed);
 edges=document.createElement('canvas');edges.width=PW;edges.height=PH;const ec=edges.getContext('2d');
 const isW=(x,y)=>y>=0&&x>=0&&y<H&&x<W&&(grid[y][x]==1||grid[y][x]==2);
 // creaky wooden floors, tinted a little differently in each room (furniture sits on the floor)
 for(let y=0;y<H;y++)for(let x=0;x<W;x++){const v=grid[y][x];if(v==1||v==2)continue;
  const px=x*T,py=y*T,ri=(x/10|0)+(y/8|0)*4;
  bc.fillStyle=`hsl(${22+ri*13%26} 26% ${13+R()*6}%)`;bc.fillRect(px,py,T,T);
  bc.fillStyle='rgba(0,0,0,.5)';bc.fillRect(px,py+10,T,1);bc.fillRect(px,py+21,T,1);
  bc.fillStyle='rgba(255,255,255,.035)';bc.fillRect(px,py+11,T,1);bc.fillRect(px,py+22,T,1);bc.fillRect(px,py,T,1);
  bc.fillStyle='rgba(0,0,0,.45)';for(let k=0;k<3;k++)if(R()<.5)bc.fillRect(px+(R()*30|0),py+k*11,1,10);
  if(R()<.07){bc.fillStyle='rgba(0,0,0,.28)';bc.beginPath();bc.arc(px+R()*T,py+R()*T,6+R()*8,0,7);bc.fill()}
  if(R()<.03){bc.strokeStyle='rgba(0,0,0,.6)';bc.lineWidth=1;bc.beginPath();let cx=px+R()*T,cy=py+R()*T;bc.moveTo(cx,cy);for(let k=0;k<4;k++){cx+=R()*14-7;cy+=R()*14-7;bc.lineTo(cx,cy)}bc.stroke()}}
 // faded rugs
 for(let r=0;r<3;r++)for(let c=0;c<4;c++)if(R()<.4){const rx=(c*10+3)*T,ry=(r*8+2)*T;bc.fillStyle='rgba(110,25,40,.4)';bc.fillRect(rx,ry,5*T,4*T);bc.strokeStyle='rgba(200,170,90,.3)';bc.lineWidth=2;bc.strokeRect(rx+5,ry+5,5*T-10,4*T-10)}
 // wallpaper walls, windows, furniture
 for(let y=0;y<H;y++)for(let x=0;x<W;x++){const v=grid[y][x],px=x*T,py=y*T;
  if(v==1){bc.fillStyle='#2a2136';bc.fillRect(px,py,T,T);bc.fillStyle='rgba(255,255,255,.045)';for(let k=0;k<4;k++)bc.fillRect(px+k*8+2,py,2,T);
   if(R()<.14){bc.fillStyle='rgba(0,0,0,.4)';bc.fillRect(px+(R()*28|0),py,3,8+(R()*18|0))}
   if(R()<.07){bc.fillStyle='rgba(90,130,100,.13)';bc.beginPath();bc.arc(px+R()*T,py+R()*T,7+R()*7,0,7);bc.fill()}}
  else if(v==2){bc.fillStyle='#14102a';bc.fillRect(px,py,T,T);bc.fillStyle='#6f95d6';bc.fillRect(px+3,py+3,T-6,T-6);bc.fillStyle='rgba(255,255,255,.25)';bc.fillRect(px+5,py+5,6,T-10);bc.fillStyle='#14102a';bc.fillRect(px+T/2-1,py+3,2,T-6);bc.fillRect(px+3,py+T/2-1,T-6,2)}
  else if(v==3){bc.fillStyle='#4d3022';bc.fillRect(px+2,py+2,T-4,T-4);bc.strokeStyle='#150b07';bc.lineWidth=2;bc.strokeRect(px+2,py+2,T-4,T-4);bc.fillStyle='rgba(255,255,255,.07)';bc.fillRect(px+4,py+4,T-8,3);bc.fillStyle='rgba(0,0,0,.3)';bc.fillRect(px+4,py+T/2,T-8,2)}}
 // cobwebs in some corners
 const web=(cx,cy,sx,sy,L)=>{bc.strokeStyle='rgba(225,225,240,.3)';bc.lineWidth=1;
  for(let i=0;i<=4;i++){const a=i*Math.PI/8;bc.beginPath();bc.moveTo(cx,cy);bc.lineTo(cx+sx*Math.cos(a)*L,cy+sy*Math.sin(a)*L);bc.stroke()}
  for(let r=1;r<=3;r++){bc.beginPath();for(let i=0;i<=4;i++){const a=i*Math.PI/8,q=L*r/3*(i%2?.82:1);bc[i?'lineTo':'moveTo'](cx+sx*Math.cos(a)*q,cy+sy*Math.sin(a)*q)}bc.stroke()}};
 for(let y=0;y<H;y++)for(let x=0;x<W;x++){if(grid[y][x]!=0||R()>=.5)continue;
  const U=isW(x,y-1),Dn=isW(x,y+1),Lf=isW(x-1,y),Rt=isW(x+1,y),L=26+R()*14;
  if(U&&Lf)web(x*T,y*T,1,1,L);else if(U&&Rt)web(x*T+T,y*T,-1,1,L);else if(Dn&&Lf)web(x*T,y*T+T,1,-1,L);else if(Dn&&Rt)web(x*T+T,y*T+T,-1,-1,L)}
 // pale moonlight pooling under each window
 WN.forEach((ws,s)=>ws.forEach(([x,y,w,h])=>{const cx=s%2==0?x+w/2:(s==3?x+w+6:x-6),cy=s%2==0?(s==0?y+h+6:y-6):y+h/2,gr=bc.createRadialGradient(cx,cy,0,cx,cy,80);
  gr.addColorStop(0,'rgba(130,170,255,.22)');gr.addColorStop(1,'rgba(130,170,255,0)');bc.fillStyle=gr;bc.beginPath();bc.arc(cx,cy,80,0,7);bc.fill()}));
 // bright wall outlines (also drawn over the fog in hunter view)
 bc.fillStyle=ec.fillStyle='#cdbfff';const E=(a,b,c,d)=>{bc.fillRect(a,b,c,d);ec.fillRect(a,b,c,d)};
 for(let y=0;y<H;y++)for(let x=0;x<W;x++){const v=grid[y][x];if(v!=1&&v!=2)continue;
  const f=(dx,dy)=>{const nx=x+dx,ny=y+dy;return nx>=0&&ny>=0&&nx<W&&ny<H&&grid[ny][nx]!=1&&grid[ny][nx]!=2};
  if(f(0,-1))E(x*T,y*T,T,3);if(f(0,1))E(x*T,y*T+T-3,T,3);
  if(f(-1,0))E(x*T,y*T,3,T);if(f(1,0))E(x*T+T-3,y*T,3,T)}
 const vg=bc.createRadialGradient(PW/2,PH/2,PH*.35,PW/2,PH/2,PW*.62);vg.addColorStop(0,'rgba(0,0,0,0)');vg.addColorStop(1,'rgba(0,0,0,.5)');bc.fillStyle=vg;bc.fillRect(0,0,PW,PH)}
function menu(){
 const M=$('menu'),m=$('mc');
 if(!live){M.style.display='flex';m.innerHTML='<p>This page needs the game server to work. Open the link to your running game (the address that ends in onrender.com), or run <code>node server.js</code> and visit http://localhost:3000. It can’t run as a plain file or inside a preview.</p>';return}
 $('leave').style.display=$('hudlogo').style.display=$('mute').style.display=ph=='play'&&me?'block':'none';
 if(ph=='play'){M.style.display='none';return}
 M.style.display='flex';
 if(!me){m.innerHTML='<p>'+CONTROLS+'</p><div class="row"><input id="nm" maxlength="14" placeholder="Your name" autofocus><button id="jn">Join</button></div>';
  $('jn').onclick=join;$('nm').onkeydown=e=>{if(e.key=='Enter')join()};return}
 const mine=(scores.find(p=>p[0]==me)||[])[2]=='g'?'g':'h',score=`Ghost ${ms[0]} – ${ms[1]} Hunters (first to ${ms[2]} rounds)`;
 if(ph=='over'){
  m.innerHTML=`<h1>${esc(msg)}</h1><p><b>${score}</b></p><p>${fin?'<b>'+esc(fin)+'</b> Match awards next…':'The next round starts shortly.'}</p>`;return}
 if(ph=='awards'){
  if(!awT)awT=Date.now();const el=(Date.now()-awT)/1000;
  const card=(i,ico,title,a,unit)=>`<div class="aw" style="animation-delay:${Math.max(0,.4+i*1.1-el)}s"><div class="ico">${ico}</div><div><b>${title}</b><br>${a?esc(a[0])+' · '+a[1]+' '+unit:'Nobody this match'}</div></div>`;
  m.innerHTML=`<h1>Match awards</h1><p><b>${esc(fin)}</b></p><div class="awards">${card(0,'🔦','Best Hunter',aw&&aw.bh,'damage to the ghost')}${card(1,'🙀','Scaredy Cat',aw&&aw.sc,'times fainted')}${card(2,'💡','Light Saver',aw&&aw.ls,'revives')}</div>${el>=3.9?'<button id="back" class="aw" style="animation-delay:0s">Return to Lobby</button>':''}`;
  if(el<3.9)setTimeout(menu,(3.9-el)*1000+60);
  if($('back'))$('back').onclick=()=>ws.send('{"t":"back"}');
  return}
 const list=scores.map(p=>`<li>${esc(p[1])}${p[0]==me?' (you)':''}<span class="chip">${p[2]=='g'?'wants to be the ghost':'hunter'}</span></li>`).join('');
 const roles=`<div class="row"><button id="rg" class="${mine=='g'?'sel':''}">I’ll be the ghost</button><button id="rh" class="${mine=='h'?'sel':''}">I’ll be a hunter</button></div><p>Players who choose ghost take turns haunting, and everyone else hunts. If nobody picks ghost, everyone takes a turn.</p>`;
 if(mp){m.innerHTML=`<h1>Waiting room</h1><p>${mp==2?'The match is over. Other players are still viewing the results, and the lobby opens as soon as everyone is back.':`A match is in progress (${score}). You’ll be back with everyone when this one ends.`} You can change your role for the next match.</p>${roles}<ol>${list}</ol>`}
 else{
  const len=host==me?`<div class="row">${[1,3,5,7].map(v=>`<button data-bo="${v}" class="${bo==v?'sel':''}">${v==1?'Quick game':'Best of '+v}</button>`).join('')}</div>`:`<p>Match: ${bo==1?'quick game (1 round)':'best of '+bo+' (first to '+(bo+1)/2+' rounds)'}</p>`;
  m.innerHTML=`<h1>Waiting room</h1>${lastM?`<p><b>Last match:</b> ${esc(lastM)}</p>`:''}<details ${help?'open':''}><summary>How to play</summary><p>${CONTROLS}</p></details>${roles}<ol>${list}</ol>${len}`+
   (host==me?`<button id="go" ${scores.length<2?'disabled':''}>Start the match</button>`:'<p>Waiting for the host to start…</p>')}
 const dt=m.querySelector('details');if(dt)dt.ontoggle=()=>{help=dt.open};
 if($('rg'))$('rg').onclick=()=>ws.send('{"t":"role","v":"g"}');
 if($('rh'))$('rh').onclick=()=>ws.send('{"t":"role","v":"h"}');
 m.querySelectorAll('[data-bo]').forEach(b=>b.onclick=()=>ws.send(JSON.stringify({t:'bo',v:+b.dataset.bo})));
 if($('go'))$('go').onclick=()=>ws.send('{"t":"start"}')}
function join(){if(ws.readyState==1)ws.send(JSON.stringify({t:'join',name:$('nm').value.trim()||'Player'}))}
ws.onmessage=e=>{const m=JSON.parse(e.data);
 if(m.t=='m'){WN=m.wn;STRP=m.st;for(const k in D)delete D[k];DG.vis=0;buildMap(m.g,m.sd)}
 else if(m.t=='l'){me=m.me;host=m.host;ph=m.ph;msg=m.msg;scores=m.ps;ms=m.ms;fin=m.fin;lastM=m.last;bo=m.bo;mp=m.mp;aw=m.aw;if(ph!='awards')awT=0;if(ph=='play'&&me)musStart();else musStop();m.ps.forEach(p=>names[p[0]]=p[1]);menu()}
 else if(m.t=='full')alert('The game is full (15 players).');
 else if(m.t=='s'){S=m;
  for(const h of m.hs){const d=D[h[0]]||(D[h[0]]={x:h[1],y:h[2]});d.tx=h[1];d.ty=h[2];d.ang=h[3];d.on=h[4];d.down=h[5];d.rev=h[6];d.id=h[0]}
  if(m.g){if(!DG.vis){DG.x=m.g[0];DG.y=m.g[1]}DG.tx=m.g[0];DG.ty=m.g[1];DG.vis=1}else DG.vis=0}};
ws.onclose=()=>{$('menu').style.display='flex';$('mc').innerHTML='<h1>Disconnected</h1><p>Reload the page to reconnect.</p>'};
// Background music: a 64s loop played with Web Audio so copies can overlap and cross-fade (no gap at the loop point)
const MUS={ctx:null,master:null,buf:null,on:false,running:false,src:[],timer:0,vol:.4,muted:false},XF=3;
try{MUS.muted=localStorage.getItem('gh_mute')=='1'}catch(e){}
function musInit(){
 if(MUS.ctx)return;
 try{const C=window.AudioContext||window.webkitAudioContext;MUS.ctx=new C();MUS.master=MUS.ctx.createGain();MUS.master.gain.value=0;MUS.master.connect(MUS.ctx.destination);
  fetch('/audio/spooky-loop.mp3').then(r=>r.arrayBuffer()).then(b=>new Promise((ok,no)=>MUS.ctx.decodeAudioData(b,ok,no))).then(buf=>{MUS.buf=buf;if(MUS.on)musLoop()}).catch(()=>{})}catch(e){MUS.ctx=null}}
function musLoop(){
 const c=MUS.ctx,b=MUS.buf;if(!c||!b||MUS.running)return;MUS.running=true;
 const play=when=>{
  if(!MUS.on){MUS.running=false;return}
  const s=c.createBufferSource(),g=c.createGain();s.buffer=b;s.connect(g);g.connect(MUS.master);
  g.gain.setValueAtTime(0,when);g.gain.linearRampToValueAtTime(1,when+XF);g.gain.setValueAtTime(1,when+b.duration-XF);g.gain.linearRampToValueAtTime(0,when+b.duration);
  s.start(when);MUS.src.push(s);s.onended=()=>{MUS.src=MUS.src.filter(x=>x!==s)};
  const next=when+b.duration-XF; // the next copy starts fading in as this one fades out
  MUS.timer=setTimeout(()=>play(next),Math.max(0,(next-c.currentTime-8)*1000))};
 play(c.currentTime+.05)}
function musLevel(sec){const c=MUS.ctx;if(!c)return;const g=MUS.master.gain;g.cancelScheduledValues(c.currentTime);g.setValueAtTime(g.value,c.currentTime);g.linearRampToValueAtTime(MUS.on&&!MUS.muted?MUS.vol:0,c.currentTime+sec)}
function musStart(){MUS.on=true;musInit();if(!MUS.ctx)return;if(MUS.ctx.resume)MUS.ctx.resume();musLevel(2);if(MUS.buf)musLoop()}
function musStop(){
 MUS.on=false;clearTimeout(MUS.timer);MUS.running=false;if(!MUS.ctx)return;musLevel(1.5);
 setTimeout(()=>{if(!MUS.on){MUS.src.forEach(s=>{try{s.stop()}catch(e){}});MUS.src=[]}},1700)}
function musToggle(){MUS.muted=!MUS.muted;try{localStorage.setItem('gh_mute',MUS.muted?'1':'0')}catch(e){}musIcon();musLevel(.3)}
function musIcon(){$('mute').textContent=MUS.muted?'🔇':'🔊'}
musIcon();$('mute').onmousedown=e=>e.preventDefault();$('mute').onclick=musToggle;
addEventListener('pointerdown',musInit,{once:true});addEventListener('keydown',musInit,{once:true});
addEventListener('keydown',e=>{if((e.key=='m'||e.key=='M')&&ph=='play'&&me&&!e.repeat)musToggle()});

// Title screen: show a random image from the server's images folder (never the same one twice in a row); click or Enter to continue
(()=>{const sp=$('splash'),im=$('splimg'),close=()=>{sp.style.display='none'};
 sp.onclick=close;sp.onkeydown=e=>{if(e.key=='Enter'||e.key==' '){e.preventDefault();close()}};sp.focus();
 fetch('/api/splash').then(r=>r.json()).then(l=>{
  if(!l.length)return close();
  let last=-1;try{last=+localStorage.getItem('gh_splash')}catch(e){}
  let i=Math.random()*l.length|0;if(l.length>1&&i==last)i=(i+1)%l.length;
  try{localStorage.setItem('gh_splash',i)}catch(e){}
  im.onload=()=>im.classList.add('ok');im.onerror=close;im.src='/images/'+encodeURIComponent(l[i])
 }).catch(close)})();
menu();
$('leave').onmousedown=e=>e.preventDefault();$('leave').onclick=()=>ws.send('{"t":"leave"}');

addEventListener('keydown',e=>{keys[e.key.toLowerCase()]=true;if(me&&(e.key==' '||e.key.startsWith('Arrow')))e.preventDefault()});
addEventListener('keyup',e=>{keys[e.key.toLowerCase()]=false});
addEventListener('blur',()=>{for(const k in keys)keys[k]=false;mouse.down=false});
cv.addEventListener('mousemove',e=>{mouse.x=(e.clientX-ox)/sc;mouse.y=(e.clientY-oy)/sc});
cv.addEventListener('mousedown',()=>mouse.down=true);addEventListener('mouseup',()=>mouse.down=false);
const K=(a,b)=>keys[a]||keys[b];
setInterval(()=>{if(!me||!S||ph!='play'||ws.readyState!=1)return;
 const my=D[me]||{x:0,y:0};
 ws.send(JSON.stringify({t:'in',kx:(K('d','arrowright')?1:0)-(K('a','arrowleft')?1:0),ky:(K('s','arrowdown')?1:0)-(K('w','arrowup')?1:0),
  ang:Math.atan2(mouse.y-my.y,mouse.x-my.x),on:mouse.down||keys[' '],dash:keys.shift,ch:keys.e}))},33);

// a fainted hunter's heart: grey, and it fills red from the bottom as the revive progresses (p = 0..1)
function heart(x,y,s,p){
 const path=()=>{ctx.beginPath();ctx.moveTo(x,y+s*.9);ctx.bezierCurveTo(x-s*1.6,y-s*.1,x-s*.9,y-s*1.2,x,y-s*.45);ctx.bezierCurveTo(x+s*.9,y-s*1.2,x+s*1.6,y-s*.1,x,y+s*.9);ctx.closePath()};
 const top=y-s*.95,bot=y+s*.9;
 path();ctx.fillStyle='#8a8699';ctx.fill();
 if(p>0){ctx.save();path();ctx.clip();ctx.fillStyle='#ff3355';const hgt=(bot-top)*Math.min(1,p);ctx.fillRect(x-2*s,bot-hgt,4*s,hgt+1);ctx.restore()}
 path();ctx.lineWidth=1.6;ctx.strokeStyle=p>0?'#ffd6dd':'#d8d4ea';ctx.stroke()}
function ghostShape(x,y){ctx.fillStyle='#ffd25a';ctx.beginPath();ctx.arc(x,y-3,11,Math.PI,0);ctx.lineTo(x+11,y+11);
 for(let i=0;i<3;i++){ctx.lineTo(x+11-i*7.33-3.67,y+6);ctx.lineTo(x+11-(i+1)*7.33,y+11)}
 ctx.closePath();ctx.fill();ctx.fillStyle='#221c3a';ctx.fillRect(x-5,y-6,3,5);ctx.fillRect(x+2,y-6,3,5)}
function bar(x,y,w,f,col,label){ctx.fillStyle='#2a2548';ctx.fillRect(x,y,w,12);ctx.fillStyle=col;ctx.fillRect(x,y,w*Math.max(0,Math.min(1,f)),12);ctx.fillStyle='#ece9fa';ctx.font='13px Georgia';ctx.textAlign='left';ctx.fillText(label,x,y-5)}

function draw(dt){
 const d=devicePixelRatio||1,top=68,vw=innerWidth,vh=innerHeight;
 if(cv.width!=vw*d||cv.height!=vh*d){cv.width=vw*d;cv.height=vh*d}
 ctx.setTransform(1,0,0,1,0,0);ctx.fillStyle='#0b0a14';ctx.fillRect(0,0,cv.width,cv.height);
 if(!S||!base)return;
 const k=Math.min(1,dt*18);
 for(const id in D){const e=D[id];e.x+=(e.tx-e.x)*k;e.y+=(e.ty-e.y)*k}
 DG.x+=(DG.tx-DG.x)*k;DG.y+=(DG.ty-DG.y)*k;
 sc=Math.min(vw/PW,(vh-top)/PH);ox=(vw-PW*sc)/2;oy=top+(vh-top-PH*sc)/2;
 ctx.setTransform(d*sc,0,0,d*sc,d*ox,d*oy);ctx.drawImage(base,0,0);
 const lt=S.lt,act=!!lt&&lt[1]>=1.5&&lt[1]<2.7,warn=!!lt&&lt[1]<1.5,hv=S.role=='hunter'&&S.ph=='play',my=D[me],hs=S.hs.map(h=>D[h[0]]),el=180-S.time;
 if(!hv)for(const h of hs)if(h.on&&!h.down){ctx.fillStyle='rgba(255,236,150,.22)';ctx.beginPath();cone(h).forEach(([x,y],i)=>i?ctx.lineTo(x,y):ctx.moveTo(x,y));ctx.fill()}
 ctx.font='11px Georgia';ctx.textAlign='center';
 for(const h of hs){
  ctx.fillStyle=h.down?'#6b6684':`hsl(${h.id*47%360} 70% 62%)`;ctx.beginPath();ctx.arc(h.x,h.y,10,0,7);ctx.fill();
  if(!h.down){ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(h.x+Math.cos(h.ang)*6,h.y+Math.sin(h.ang)*6,3.5,0,7);ctx.fill()}
  if(h.id==me){ctx.strokeStyle='#fff';ctx.lineWidth=2;ctx.beginPath();ctx.arc(h.x,h.y,14,0,7);ctx.stroke()}}
 if(hv&&my){
  fc.globalCompositeOperation='source-over';fc.fillStyle=act?'rgba(6,5,14,.9)':'rgba(6,5,14,.95)';fc.fillRect(0,0,PW,PH);
  fc.globalCompositeOperation='destination-out';
  const glow=(x,y,r)=>{const gr=fc.createRadialGradient(x,y,0,x,y,r);gr.addColorStop(0,'rgba(0,0,0,1)');gr.addColorStop(1,'rgba(0,0,0,0)');fc.fillStyle=gr;fc.beginPath();fc.arc(x,y,r,0,7);fc.fill()};
  glow(my.x,my.y,70);
  for(const h of hs){if(h!==my)glow(h.x,h.y,el<4.5?60:22);
   if(h.on&&!h.down){const gr=fc.createRadialGradient(h.x,h.y,0,h.x,h.y,RANGE);gr.addColorStop(0,'rgba(0,0,0,1)');gr.addColorStop(1,'rgba(0,0,0,.25)');fc.fillStyle=gr;fc.beginPath();cone(h).forEach(([x,y],i)=>i?fc.lineTo(x,y):fc.moveTo(x,y));fc.fill()}}
  if(act)for(const[x,y,w,h]of STRP[lt[0]]){fc.fillStyle=lg(fc,lt[0],x,y,w,h,'rgba(0,0,0,.95)','rgba(0,0,0,.45)');fc.fillRect(x,y,w,h)}
  ctx.drawImage(fog,0,0);ctx.globalAlpha=.6;ctx.drawImage(edges,0,0);ctx.globalAlpha=1;
  if(S.near){ctx.font='bold 26px Georgia';ctx.textAlign='center';ctx.fillStyle=S.near==2?'#ff6b8b':'#ffd25a';ctx.fillText(S.near==2?'!':'?',my.x,my.y-24)}}
 // always visible (drawn over the fog): batteries, hearts over fainted hunters, the revealed ghost, start-of-round name tags
 for(const p of S.pk){const pl=.6+.4*Math.sin(Date.now()/250);ctx.fillStyle=`rgba(124,242,160,${.2*pl})`;ctx.beginPath();ctx.arc(p.x,p.y,19,0,7);ctx.fill();
  ctx.fillStyle='#7cf2a0';ctx.fillRect(p.x-6,p.y-9,12,18);ctx.fillStyle='#0b3a22';ctx.fillRect(p.x-3,p.y-12,6,3);ctx.fillRect(p.x-2,p.y-4,4,8)}
 for(const h of hs)if(h.down)heart(h.x+18,h.y-22,13,h.rev);
 if(DG.vis){const gl=ctx.createRadialGradient(DG.x,DG.y,2,DG.x,DG.y,30);gl.addColorStop(0,'rgba(255,210,90,.45)');gl.addColorStop(1,'rgba(255,210,90,0)');ctx.fillStyle=gl;ctx.beginPath();ctx.arc(DG.x,DG.y,30,0,7);ctx.fill();ghostShape(DG.x,DG.y)}
 if(S.ph=='play'&&el<4.5){const a=Math.max(0,Math.min(1,4.5-el));ctx.globalAlpha=a;ctx.font='bold 13px Georgia';ctx.textAlign='center';ctx.lineWidth=3;ctx.strokeStyle='rgba(0,0,0,.85)';ctx.fillStyle='#ece9fa';
  for(const h of hs){const n=names[h.id]||'';ctx.strokeText(n,h.x,h.y+27);ctx.fillText(n,h.x,h.y+27)}
  if(DG.vis&&names[S.gid]){ctx.strokeText(names[S.gid],DG.x,DG.y+28);ctx.fillText(names[S.gid],DG.x,DG.y+28)}
  ctx.globalAlpha=1}
 if(lt){const s=lt[0];
  if(warn){ctx.fillStyle=`rgba(190,220,255,${.35+.35*Math.sin(lt[1]*22)})`;for(const[x,y,w,h]of WN[s])ctx.fillRect(x,y,w,h)}
  else if(act){for(const[x,y,w,h]of STRP[s]){ctx.fillStyle=lg(ctx,s,x,y,w,h,'rgba(200,225,255,.55)','rgba(200,225,255,.12)');ctx.fillRect(x,y,w,h)}
   if(lt[1]<1.7){ctx.fillStyle=`rgba(255,255,255,${(1.7-lt[1])*.5})`;ctx.fillRect(0,0,PW,PH)}}}
 if(S.ring>0){ctx.fillStyle=`rgba(150,90,255,${S.ring*.6})`;ctx.fillRect(0,0,PW,PH)}
 ctx.setTransform(d,0,0,d,0,0);ctx.font='15px Georgia';ctx.textAlign='left';ctx.fillStyle='#ece9fa';
 if(S.al&&S.al[0]>0){const[n,t]=S.al,a=Math.min(1,t/.6);ctx.fillStyle=`rgba(20,8,24,${.75*a})`;ctx.fillRect(0,vh*.36,vw,72);
  ctx.fillStyle=`rgba(255,107,139,${a})`;ctx.font='bold 40px Georgia';ctx.textAlign='center';ctx.fillText(`${n} Hunter${n==1?'':'s'} Left`,vw/2,vh*.36+50);ctx.textAlign='left';ctx.font='15px Georgia';ctx.fillStyle='#ece9fa'}
 const m=Math.max(0,S.time),dn=S.hs.filter(h=>h[5]).length;
 ctx.fillText(`${{ghost:'Ghost',hunter:'Hunter',spec:'Spectating'}[S.role]}   ${m/60|0}:${String(m%60|0).padStart(2,'0')}   ${dn}/${S.hs.length} fainted`,128,28);ctx.fillStyle='#ffd25a';ctx.fillText(`Ghost ${S.sc[0]} – ${S.sc[1]} Hunters · first to ${S.sc[2]}`,128,50);ctx.fillStyle='#ece9fa';
 bar(vw-220,22,200,S.hp/S.mx,'#ffd25a','Ghost health');
 if(S.role=='hunter')bar(vw-220,50,200,S.bat/100,S.bat<30?'#ff6b8b':'#7cf2a0',my&&my.down?'You fainted: wait for a revive':`Battery: ${Math.ceil(S.bat*.3)}s`);
 else if(S.role=='ghost'){if(S.st){ctx.fillStyle='#ffd25a';ctx.font='bold 18px Georgia';ctx.textAlign='center';ctx.fillText('Stunned!',vw/2,96)}bar(vw-220,50,200,S.ch,'#b48cff','Magic (hold E)');ctx.fillStyle=S.dc<=0?'#7cf2a0':'#6b6684';ctx.fillText('Dash',vw-268,61)}}
let last=0;
(function loop(t){const dt=Math.min(.05,(t-last)/1000||0);last=t;draw(dt);requestAnimationFrame(loop)})(0);
</script></body></html>
